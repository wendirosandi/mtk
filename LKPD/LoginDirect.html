<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Exambrowser — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="bg-white rounded-3xl shadow-2xl p-6 space-y-4">
    <div class="text-center space-y-1">
      <h1 id="ld-judul" class="text-xl font-extrabold text-slate-800">Ujian EBC Exambrowser</h1>
      <p id="ld-sub" class="text-xs text-slate-500">SMPN 2 Karawang Barat</p>
      <p id="ld-desk" class="text-xs text-slate-600"></p>
    </div>
    <div class="bg-teal-50 border border-teal-200 rounded-xl p-3 text-[11px] text-teal-900 whitespace-pre-line" id="ld-instr"></div>

    <div class="space-y-1">
      <label class="text-xs font-bold text-slate-500 uppercase">1 • Pilih Nama Ujian (wajib)</label>
      <select id="ex-select" class="w-full border-2 rounded-xl px-3 py-3 text-sm font-semibold bg-white">
        <option value="">— memuat daftar ujian —</option>
      </select>
    </div>

    <div id="ld-form" class="space-y-3 opacity-50 pointer-events-none">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase">2 • Username</label>
        <input id="ld-user" class="w-full border-2 rounded-xl px-3 py-3 text-sm" placeholder="Username" autocomplete="off">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-500 uppercase">3 • Password</label>
        <input id="ld-pass" type="password" class="w-full border-2 rounded-xl px-3 py-3 text-sm" placeholder="Password">
      </div>
      <button id="ld-login" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-extrabold py-3 rounded-xl">Masuk →</button>
    </div>
    <p id="ld-msg" class="text-xs text-center text-rose-600 font-semibold"></p>
    <p class="text-[10px] text-center text-slate-400" id="ld-guru"></p>
  </div>
</div>

<script>
/* ==== KONFIGURASI — samakan dengan milik Anda ==== */
const GS_URL='https://script.google.com/macros/s/AKfycbwGl1QrogFsVxHnVn_l7XC2AvU8ZCbS0Svg8T15ikBOMbagi88l8bH1Js61i1feUNHfTw/exec';
const CSV_URL='';   /* salin dari LoginDirect lama */
const UA_WAJIB='CBT-MTK-SMPN2Karbar';
const FALLBACK_LIST=[
  {kode:'MTK-005',nama:'Penilaian Tengah Semester (PTS) Ganjil'},
  {kode:'MTK-003',nama:'Tes Formatif Bilangan Berpangkat & Bentuk Akar'}
];
const $=s=>document.querySelector(s);
const post=p=>fetch(GS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json());

/* ==== UA GATE ==== */
if((navigator.userAgent||'').indexOf(UA_WAJIB)<0){
  document.body.innerHTML='<div class="max-w-md mx-auto mt-16 bg-white border-2 border-rose-300 rounded-xl p-6 text-center"><h2 class="font-extrabold text-rose-600">Akses Ditolak</h2><p class="text-sm text-slate-600 mt-2">Halaman ini hanya dapat dibuka melalui Aplikasi EBC Exambrowser resmi.</p></div>';
  throw new Error('UA tidak sah');
}

/* ==== INFO DARI CSV ==== */
(async()=>{
  try{
    const t=await (await fetch(CSV_URL)).text();
    const o={};
    t.split(/\r?\n/).forEach(r=>{const i=r.indexOf(',');if(i<0)return;const k=r.slice(0,i).trim().replace(/^"|"$/g,'');const v=r.slice(i+1).trim().replace(/^"|"$/g,'');if(k)o[k]=v;});
    if(o.DIRECT_JUDUL)$('#ld-judul').textContent=o.DIRECT_JUDUL;
    if(o.DIRECT_SUBJUDUL)$('#ld-sub').textContent=o.DIRECT_SUBJUDUL;
    if(o.DIRECT_DESKRIPSI)$('#ld-desk').textContent=o.DIRECT_DESKRIPSI;
    if(o.DIRECT_INSTRUKSI)$('#ld-instr').textContent=o.DIRECT_INSTRUKSI;
    if(o.DIRECT_GURU)$('#ld-guru').textContent='Guru: '+o.DIRECT_GURU;
  }catch(e){}
})();

/* ==== DAFTAR UJIAN (terbaru dulu) ==== */
let EX={selected:null};
(async()=>{
  let list=null;
  try{ const r=await post({action:'directExamList'}); if(r.ok&&r.list&&r.list.length) list=r.list; }catch(e){}
  if(!list) list=FALLBACK_LIST;
  $('#ex-select').innerHTML='<option value="">— Pilih Nama Ujian —</option>'+list.map(x=>`<option value="${x.kode}">${x.kode} : ${x.nama}</option>`).join('');
})();
$('#ex-select').onchange=()=>{
  EX.selected=$('#ex-select').value||null;
  const on=!!EX.selected;
  $('#ld-form').classList.toggle('opacity-50',!on);
  $('#ld-form').classList.toggle('pointer-events-none',!on);
  $('#ld-msg').textContent='';
};

/* ==== LOGIN ==== */
$('#ld-login').onclick=async()=>{
  const kode=EX.selected;
  if(!kode){ $('#ld-msg').textContent='Pilih nama ujian terlebih dahulu.'; return; }
  const u=$('#ld-user').value.trim(), p=$('#ld-pass').value;
  if(!u||!p){ $('#ld-msg').textContent='Isi username dan password.'; return; }
  $('#ld-login').disabled=true; $('#ld-login').textContent='Memverifikasi...';
  let r;
  try{ r=await post({action:'directLogin',u:u,p:p,kode:kode}); }
  catch(e){ $('#ld-msg').textContent='Gagal koneksi server.'; $('#ld-login').disabled=false; $('#ld-login').textContent='Masuk →'; return; }
  if(!r.ok){ $('#ld-msg').textContent='Username/password salah.'; $('#ld-login').disabled=false; $('#ld-login').textContent='Masuk →'; return; }
  const st=(r.status||{})[kode];
  if(st && st.skorKuis && st.skorKuis!=='-'){
    if(!confirm('⚠️ Anda sudah menyelesaikan '+kode+' (Skor LKPD: '+st.skorLkpd+', Kuis: '+st.skorKuis+').\nMasuk lagi = percobaan baru dan menimpa catatan lama.\nLanjutkan?')){
      $('#ld-login').disabled=false; $('#ld-login').textContent='Masuk →'; return;
    }
  }
  localStorage.setItem('DIRECT_SESSION', JSON.stringify({username:r.username,nama:r.nama,kelas:r.kelas,kategori:r.kategori,kode:kode,ts:Date.now()}));
  const target=r.target || (kode==='MTK-003'?'TesFormatif1.html':'');
  if(!target){ $('#ld-msg').textContent='FileHTML ujian tidak ditemukan di DaftarLKPD.'; $('#ld-login').disabled=false; $('#ld-login').textContent='Masuk →'; return; }
  location.href=target;
};
</script>
</body>
</html>
