<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Web Belajar Interaktif v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;font:600 12px sans-serif;padding:10px 16px;border-radius:999px;z-index:10000;opacity:0;transition:.3s;}
.toast.show{opacity:1;}
#loader-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);backdrop-filter:blur(3px);}
#loader-overlay.hidden{display:none;}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid #e0e7ff;border-top-color:#0f766e;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.svc{background:#fff;border-radius:14px;padding:14px;text-align:center;font:700 12px sans-serif;color:#334155;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.svc .ic{display:flex;align-items:center;justify-content:center;margin:0 auto 8px;width:42px;height:42px;border-radius:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
</style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="toast" class="toast"></div>
<div id="loader-overlay"><div style="background:#fff;border-radius:16px;padding:22px 28px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:center"><div class="spinner"></div><div id="loader-text" style="font:700 13px sans-serif">Memuat...</div></div></div>
<div id="main" class="max-w-4xl mx-auto px-4 py-6"></div>

<script src="lib/config.js"></script>
<script src="lib/router.js"></script>
<script src="lib/portal-api.js"></script>

<!-- Register semua route (akan ditambah per fase) -->
<script src="pages/login.js"></script>
<script src="pages/dash-siswa.js"></script>
<script src="pages/dash-guru.js"></script>
<!-- F2, F3, F4 akan ditambahkan bertahap -->
</body>
</html>
