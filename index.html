<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn:active { transform: scale(0.98); }
        .timer-warning { background-color: #ef4444; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        /* Scrollbar halus untuk grid nomor */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-5 fade-in relative overflow-hidden min-h-[500px] flex flex-col">
        <!-- Konten akan di-render oleh JavaScript -->
    </div>

<script>
    // ================= KONFIGURASI =================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5u_MP8qFVe53hTJUvKBun__A0RAM9rDh4GyrSaUrfc5qwAV0Y_OHA_7mxIKjZ8AOpSSUcTy172j_f/pub?gid=1343827068&single=true&output=csv";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyNxZc1SYIZNJJqR3Ld3uDGo6F0biHNwltQ7L1a7JVwFv_YHdPUL1Yq_wOP5lsLx_RW/exec"; 
    // ===============================================

    let state = {
        step: 'home',
        name: '',
        kelas: '',
        kategori: '',
        questions: [],
        currentIndex: 0,
        userAnswers: {}, // Format: { 0: 'A', 1: 'C' } agar bisa diubah-ubah saat kembali
        score: 0,
        timer: {
            totalSeconds: 0,
            remainingSeconds: 0,
            intervalId: null,
            canSubmit: false
        },
        showGrid: false // Untuk toggle tampilan grid nomor soal
    };

    // --- Fungsi Utilitas ---
    function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            nama: params.get('nama') || params.get('Nama') || '',
            kelas: params.get('kelas') || params.get('Kelas') || '',
            kategori: params.get('kategori') || params.get('Kategori') || 'C'
        };
    }

    function shuffleArray(array) {
        const newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    function saveState() { localStorage.setItem('quizState', JSON.stringify(state)); }
    function clearCache() { localStorage.removeItem('quizState'); }

    function parseCSV(text) {
        const lines = text.split('\n').filter(l => l.trim() !== '');
        if (lines.length < 2) return [];
        
        const parseLine = (line) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else { current += char; }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
        };
        
        const headers = parseLine(lines[0]);
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const values = parseLine(lines[i]);
            const obj = {};
            headers.forEach((header, index) => { obj[header.trim()] = values[index] || ''; });
            result.push(obj);
        }
        return result;
    }

    function mapQuestions(rawData) {
        return rawData.map((row, index) => {
            const soal = row.Soal || row.soal || '';
            const jawabanBenar = (row.Jawaban || row.jawaban || '').trim().toUpperCase();
            
            // Normalisasi Kategori: Ambil huruf pertama jika A, B, atau C untuk pencocokan yang ketat
            let rawKat = (row.Kategori || row.kategori || 'C').trim().toUpperCase();
            let cleanKat = rawKat;
            if (['A', 'B', 'C'].includes(rawKat.charAt(0))) {
                cleanKat = rawKat.charAt(0);
            }

            const options = [
                { text: row.OpsiA || row.opsiA || '', key: 'A', isCorrect: false },
                { text: row.OpsiB || row.opsiB || '', key: 'B', isCorrect: false },
                { text: row.OpsiC || row.opsiC || '', key: 'C', isCorrect: false },
                { text: row.OpsiD || row.opsiD || '', key: 'D', isCorrect: false }
            ];
            
            options.forEach(opt => {
                if (opt.key === jawabanBenar) opt.isCorrect = true;
            });
            
            return {
                noUrut: row.NoUrut || index + 1,
                mapel: row.Mapel || row.mapel || 'Umum',
                materi: row.Materi || row.materi || '-',
                soal: soal,
                options: options,
                kategori: cleanKat, // Hanya 'A', 'B', atau 'C'
                jawabanBenar: jawabanBenar
            };
        }).filter(q => q.soal && q.options.some(o => o.text !== ''));
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startTimer(totalMinutes) {
        state.timer.totalSeconds = totalMinutes * 60;
        state.timer.remainingSeconds = totalMinutes * 60;
        state.timer.canSubmit = false;
        
        state.timer.intervalId = setInterval(() => {
            state.timer.remainingSeconds--;
            const elapsedSeconds = state.timer.totalSeconds - state.timer.remainingSeconds;
            
            if (elapsedSeconds >= state.timer.totalSeconds / 2) {
                state.timer.canSubmit = true;
            }
            
            if (state.timer.remainingSeconds <= 0) {
                clearInterval(state.timer.intervalId);
                if (state.step === 'quiz') finishQuiz(true); // true = auto finish karena waktu habis
            }
            
            if (state.step === 'quiz') updateTimerUI();
            saveState();
        }, 1000);
    }

    function updateTimerUI() {
        const timerEl = document.getElementById('timer-display');
        if (!timerEl) return;
        
        const timeStr = formatTime(state.timer.remainingSeconds);
        const isWarning = state.timer.remainingSeconds < 60;
        timerEl.className = `text-xl font-bold font-mono px-3 py-1 rounded-lg ${isWarning ? 'timer-warning' : 'text-indigo-600 bg-indigo-50'}`;
        timerEl.innerHTML = `⏱️ ${timeStr}`;
        
        updateSubmitButtonState();
    }

    function updateSubmitButtonState() {
        const submitBtn = document.getElementById('submit-btn');
        if (!submitBtn) return;
        
        const elapsedSeconds = state.timer.totalSeconds - state.timer.remainingSeconds;
        const canSubmit = elapsedSeconds >= state.timer.totalSeconds / 2;
        
        if (!canSubmit) {
            const remainingWait = Math.ceil((state.timer.totalSeconds / 2 - elapsedSeconds) / 60);
            submitBtn.disabled = true;
            submitBtn.className = "w-full bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded-xl cursor-not-allowed flex items-center justify-center gap-2 transition-all";
            submitBtn.innerHTML = `⏱️ Tunggu ${remainingWait} menit lagi`;
        } else {
            submitBtn.disabled = false;
            submitBtn.className = "w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-green-700 shadow-md flex items-center justify-center gap-2 transition-all fade-in";
            submitBtn.innerHTML = '🏁 Selesai & Kirim';
        }
    }

    // --- Render UI ---
    function render() {
        const app = document.getElementById('app');
        app.innerHTML = ''; // Clear
        if (state.step === 'home') renderHome(app);
        else if (state.step === 'loading') renderLoading(app);
        else if (state.step === 'quiz') renderQuiz(app);
        else if (state.step === 'result') renderResult(app);
        else if (state.step === 'success') renderSuccess(app);
        else if (state.step === 'error') renderError(app);
    }

    function renderHome(app) {
        const params = getQueryParams();
        if (!params.nama || !params.kelas) {
            renderError(app);
            return;
        }
        
        state.name = params.name = params.nama;
        state.kelas = params.kelas;
        state.kategori = params.kategori || 'C';
        
        const kategoriLabel = { 'A': 'A - Sulit', 'B': 'B - Sedang', 'C': 'C - Mudah' };
        
        app.innerHTML = `
            <div class="text-center fade-in flex-1 flex flex-col justify-center">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">📚</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-1">Kuis Interaktif</h1>
                <p class="text-gray-500 text-sm mb-6">Selamat mengerjakan, tetap fokus!</p>
                
                <div class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Nama Lengkap</label>
                        <input type="text" value="${state.name}" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-700 font-medium">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Kelas</label>
                            <input type="text" value="${state.kelas}" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-700 font-medium text-center">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase">Kategori</label>
                            <input type="text" value="${kategoriLabel[state.kategori] || state.kategori}" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-700 font-medium text-center">
                        </div>
                    </div>
                    
                    <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mt-4">
                        <p class="text-sm text-blue-800 leading-relaxed">
                            <span class="font-bold">ℹ️ Aturan Pengerjaan:</span><br>
                            • Waktu: Jumlah Soal × 2 menit<br>
                            • Wajib mengerjakan minimal <span class="font-bold">50% dari total waktu</span> sebelum tombol kirim aktif.
                        </p>
                    </div>
                    
                    <button onclick="handleStart()" class="w-full bg-indigo-600 text-white font-bold py-3.5 px-6 rounded-xl hover:bg-indigo-700 transition-all duration-200 shadow-lg mt-4 flex items-center justify-center gap-2">
                        <span>🚀 Mulai Kuis</span>
                    </button>
                </div>
            </div>
        `;
    }

    function renderLoading(app) {
        app.innerHTML = `
            <div class="flex-1 flex flex-col items-center justify-center fade-in">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"></div>
                <p class="text-gray-600 font-medium">Memuat bank soal...</p>
            </div>
        `;
    }

    function renderQuiz(app) {
        const q = state.questions[state.currentIndex];
        const totalQ = state.questions.length;
        const progress = ((state.currentIndex + 1) / totalQ) * 100;
        const currentAnswer = state.userAnswers[state.currentIndex];

        let html = `
            <div class="fade-in flex-1 flex flex-col">
                <!-- Header: Timer & Grid Toggle -->
                <div class="flex justify-between items-center mb-4">
                    <button onclick="toggleGrid()" class="flex items-center gap-1 text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-lg hover:bg-indigo-100 transition">
                        <span>📋</span> Nomor Soal
                    </button>
                    <div id="timer-display"></div>
                </div>

                <!-- Grid Nomor Soal (Conditional) -->
                ${state.showGrid ? `
                <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-200 fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-gray-500 uppercase">Peta Soal</span>
                        <button onclick="toggleGrid()" class="text-gray-400 hover:text-gray-600">✕</button>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${state.questions.map((_, idx) => {
                            const isAnswered = state.userAnswers[idx] !== undefined;
                            const isCurrent = idx === state.currentIndex;
                            let btnClass = "h-9 rounded-lg text-sm font-bold transition-all ";
                            if (isCurrent) btnClass += "bg-indigo-600 text-white ring-2 ring-indigo-200";
                            else if (isAnswered) btnClass += "bg-green-100 text-green-700 border border-green-200";
                            else btnClass += "bg-white text-gray-500 border border-gray-200 hover:bg-gray-100";
                            
                            return `<button onclick="jumpToQuestion(${idx})" class="${btnClass}">${idx + 1}</button>`;
                        }).join('')}
                    </div>
                </div>
                ` : ''}

                <!-- Progress Bar -->
                <div class="w-full bg-gray-100 rounded-full h-1.5 mb-4">
                    <div class="bg-indigo-600 h-1.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                </div>

                <!-- Info Soal -->
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">${q.materi}</span>
                    <span class="text-xs text-gray-400">Soal ${state.currentIndex + 1} / ${totalQ}</span>
                </div>

                <!-- Pertanyaan -->
                <h2 class="text-lg font-semibold text-gray-800 mb-5 leading-relaxed flex-1">${q.soal}</h2>

                <!-- Pilihan Jawaban -->
                <div class="space-y-3 mb-6">
                    ${q.shuffledOptions.map((opt, idx) => {
                        const isSelected = currentAnswer === opt.key;
                        return `
                        <button onclick="selectOption('${opt.key}', ${opt.isCorrect})" 
                            class="option-btn w-full text-left p-3.5 rounded-xl border-2 transition-all duration-200 flex items-start gap-3
                            ${isSelected ? 'border-indigo-600 bg-indigo-50' : 'border-gray-100 hover:border-indigo-300 hover:bg-gray-50'}">
                            <span class="flex-shrink-0 w-8 h-8 rounded-full ${isSelected ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-600'} text-center leading-8 font-bold text-sm transition-colors">
                                ${opt.key}
                            </span>
                            <span class="pt-1 text-sm font-medium text-gray-700">${opt.text}</span>
                        </button>
                        `;
                    }).join('')}
                </div>

                <!-- Navigasi -->
                <div class="grid grid-cols-2 gap-3 mt-auto">
                    <button onclick="prevQuestion()" 
                        class="py-3 px-4 rounded-xl font-semibold border-2 border-gray-200 text-gray-600 hover:bg-gray-50 transition-all flex items-center justify-center gap-2
                        ${state.currentIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                        ${state.currentIndex === 0 ? 'disabled' : ''}>
                        ← Kembali
                    </button>
                    
                    ${state.currentIndex === totalQ - 1 ? 
                        `<button id="submit-btn" onclick="finishQuiz()" class="py-3 px-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all">🏁 Selesai & Kirim</button>` :
                        `<button onclick="nextQuestion()" class="py-3 px-4 rounded-xl font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition-all flex items-center justify-center gap-2 shadow-md">
                            Lanjut →
                        </button>`
                    }
                </div>
                <!-- Jika di soal terakhir, tombol selesai tetap di bawah tapi diatur oleh updateSubmitButtonState -->
                ${state.currentIndex === totalQ - 1 ? '<div id="submit-btn-container" class="mt-3"></div>' : ''}
            </div>
        `;
        
        app.innerHTML = html;
        updateTimerUI();
        
        // Jika di soal terakhir, pindahkan tombol submit ke container bawah agar rapi
        if (state.currentIndex === totalQ - 1) {
            const submitBtn = document.getElementById('submit-btn');
            const container = document.getElementById('submit-btn-container');
            if (submitBtn && container) {
                container.appendChild(submitBtn);
                submitBtn.className = "w-full"; // Reset class agar full width
                updateSubmitButtonState();
            }
        }
    }

    function renderResult(app) {
        // --- PERBAIKAN LOGIKA SKOR ---
        let correctCount = 0;
        let detailJawaban = '';
        
        state.questions.forEach((q, idx) => {
            const userAnsKey = state.userAnswers[idx];
            const correctOpt = q.options.find(o => o.isCorrect);
            const correctKey = correctOpt ? correctOpt.key : '?';
            
            if (userAnsKey === correctKey) {
                correctCount++;
                detailJawaban += `<li class="flex items-center text-green-700 text-sm py-1.5 bg-green-50 px-3 rounded-lg mb-1"><span class="mr-2">✅</span><span><b>No.${idx+1}:</b> Benar (${userAnsKey})</span></li>`;
            } else {
                const ansText = userAnsKey ? userAnsKey : 'Kosong';
                detailJawaban += `<li class="flex items-start text-red-700 text-sm py-1.5 bg-red-50 px-3 rounded-lg mb-1"><span class="mr-2">❌</span><span><b>No.${idx+1}:</b> Salah (Jawab: ${ansText}, Kunci: ${correctKey})</span></li>`;
            }
        });

        state.score = Math.round((correctCount / state.questions.length) * 100);
        saveState();

        app.innerHTML = `
            <div class="text-center fade-in flex-1 flex flex-col justify-center">
                <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">🏆</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-1">Kuis Selesai!</h2>
                <p class="text-gray-500 text-sm mb-6">Berikut adalah ringkasan hasil kuis Anda</p>
                
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 mb-6 text-white shadow-lg">
                    <div class="text-5xl font-bold mb-1">${state.score}</div>
                    <div class="text-indigo-100 text-sm font-medium">Skor Akhir</div>
                    <div class="text-xs text-indigo-200 mt-3 pt-3 border-t border-indigo-400/30">Benar ${correctCount} dari ${state.questions.length} soal</div>
                </div>
                
                <div class="text-left bg-gray-50 rounded-xl p-4 mb-6 max-h-48 overflow-y-auto border border-gray-200 no-scrollbar">
                    <h3 class="font-semibold mb-3 text-sm text-gray-700 border-b pb-2 sticky top-0 bg-gray-50">Detail Jawaban:</h3>
                    <ul>${detailJawaban}</ul>
                </div>
                
                <button onclick="sendToGAS()" id="sendBtn" class="w-full bg-green-600 text-white font-bold py-3.5 px-6 rounded-xl hover:bg-green-700 transition-all duration-200 shadow-lg flex items-center justify-center gap-2">
                    <span>📤 Kirim Nilai ke Guru</span>
                </button>
                <p class="text-xs text-gray-400 mt-3">*Data akan dikirim dan cache lokal dihapus.</p>
            </div>
        `;
    }

    function renderSuccess(app) {
        app.innerHTML = `
            <div class="text-center fade-in flex-1 flex flex-col justify-center">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">✅</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Berhasil Dikirim!</h2>
                <p class="text-gray-600 mb-8 text-sm">Nilai kamu telah tersimpan dengan aman di database guru.</p>
                <button onclick="resetQuiz()" class="w-full bg-indigo-600 text-white font-bold py-3.5 px-6 rounded-xl hover:bg-indigo-700 transition-all duration-200 shadow-lg">
                    🔄 Kembali ke Awal
                </button>
            </div>
        `;
    }

    function renderError(app) {
        app.innerHTML = `
            <div class="text-center fade-in flex-1 flex flex-col justify-center">
                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">⚠️</span>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Akses Ditolak</h2>
                <p class="text-gray-600 mb-6 text-sm px-4">Periksa Link yang benar yang diberikan Guru Kamu.</p>
                <button onclick="window.history.back()" class="w-full bg-gray-800 text-white font-bold py-3.5 px-6 rounded-xl hover:bg-gray-900 transition-all duration-200 shadow-lg">
                    ← Kembali
                </button>
            </div>
        `;
    }

    // --- Logika Aplikasi ---
    function handleStart() {
        state.step = 'loading';
        render();
        
        fetch(CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                const rawData = parseCSV(csvText);
                
                // FILTER KATEGORI YANG KETAT
                // Hanya ambil soal yang kategori-nya persis sama dengan pilihan user (A, B, atau C)
                let filtered = mapQuestions(rawData).filter(q => q.kategori === state.kategori);
                
                if (filtered.length === 0) {
                    alert(`Maaf, tidak ada soal yang tersedia untuk Kategori ${state.kategori}. Silakan hubungi guru.`);
                    state.step = 'home';
                    render();
                    return;
                }
                
                // Acak urutan soal
                filtered = shuffleArray(filtered);
                
                // Acak opsi jawaban untuk setiap soal
                state.questions = filtered.map(q => ({
                    ...q,
                    shuffledOptions: shuffleArray([...q.options])
                }));
                
                const totalMinutes = state.questions.length * 2; // 2 menit per soal
                
                state.currentIndex = 0;
                state.userAnswers = {};
                state.score = 0;
                state.step = 'quiz';
                state.showGrid = false;
                
                startTimer(totalMinutes);
                saveState();
                render();
            })
            .catch(err => {
                console.error(err);
                alert("Gagal memuat soal. Periksa koneksi internet Anda.");
                state.step = 'home';
                render();
            });
    }

    function selectOption(key, isCorrect) {
        // Simpan jawaban berdasarkan index soal, bisa ditimpa jika user kembali dan mengganti
        state.userAnswers[state.currentIndex] = key;
        saveState();
        
        // Auto next setelah jeda singkat agar UX lebih baik (opsional, tapi bagus untuk mobile)
        setTimeout(() => {
            if (state.currentIndex < state.questions.length - 1) {
                nextQuestion();
            } else {
                render(); // Re-render untuk update state tombol di soal terakhir
            }
        }, 250);
    }

    function nextQuestion() {
        if (state.currentIndex < state.questions.length - 1) {
            state.currentIndex++;
            state.showGrid = false; // Tutup grid saat pindah soal
            saveState();
            render();
        }
    }

    function prevQuestion() {
        if (state.currentIndex > 0) {
            state.currentIndex--;
            state.showGrid = false;
            saveState();
            render();
        }
    }

    function jumpToQuestion(index) {
        state.currentIndex = index;
        state.showGrid = false;
        saveState();
        render();
    }

    function toggleGrid() {
        state.showGrid = !state.showGrid;
        render();
    }

    function finishQuiz(isAuto = false) {
        if (!isAuto) {
            const elapsedSeconds = state.timer.totalSeconds - state.timer.remainingSeconds;
            if (elapsedSeconds < state.timer.totalSeconds / 2) {
                const remainingWait = Math.ceil((state.timer.totalSeconds / 2 - elapsedSeconds) / 60);
                alert(`⏱️ Anda harus menunggu minimal ${remainingWait} menit lagi sebelum menyelesaikan kuis.`);
                return;
            }
            
            // Konfirmasi jika belum semua soal dijawab
            const answeredCount = Object.keys(state.userAnswers).length;
            if (answeredCount < state.questions.length) {
                if (!confirm(`Anda baru menjawab ${answeredCount} dari ${state.questions.length} soal. Yakin ingin menyelesaikan kuis?`)) {
                    return;
                }
            }
        }
        
        if (state.timer.intervalId) clearInterval(state.timer.intervalId);
        state.step = 'result';
        saveState();
        render();
    }

    async function sendToGAS() {
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Mengirim...`;
        
        // Format detail jawaban untuk GAS
        const jawabanDetail = state.questions.map((q, i) => {
            const userAnsKey = state.userAnswers[i];
            const correctOpt = q.options.find(o => o.isCorrect);
            const correctKey = correctOpt ? correctOpt.key : '?';
            const status = userAnsKey === correctKey ? '✅' : '❌';
            const ansText = userAnsKey ? userAnsKey : 'Kosong';
            return `No.${i+1}: ${status} (Jawab: ${ansText}, Kunci: ${correctKey})`;
        }).join(' | ');

        const payload = {
            nama: state.name,
            kelas: state.kelas,
            kategori: state.kategori,
            skor: state.score,
            waktuPengerjaan: state.timer.totalSeconds - state.timer.remainingSeconds,
            jawaban: jawabanDetail
        };
        
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            
            clearCache();
            state.step = 'success';
            render();
        } catch (error) {
            console.error(error);
            alert("Gagal mengirim nilai. Periksa koneksi internet Anda.");
            btn.disabled = false;
            btn.innerHTML = `<span>📤 Kirim Nilai ke Guru</span>`;
        }
    }

    function resetQuiz() {
        if (state.timer.intervalId) clearInterval(state.timer.intervalId);
        state = {
            step: 'home', name: '', kelas: '', kategori: '', questions: [],
            currentIndex: 0, userAnswers: {}, score: 0, showGrid: false,
            timer: { totalSeconds: 0, remainingSeconds: 0, intervalId: null, canSubmit: false }
        };
        // Hapus param URL agar kembali ke bersih (opsional, tapi lebih rapi)
        window.history.replaceState({}, document.title, window.location.pathname);
        render();
    }

    // --- Inisialisasi ---
    function init() {
        const cached = localStorage.getItem('quizState');
        if (cached) {
            const parsed = JSON.parse(cached);
            
            // Restore sesi kuis yang terputus
            if (parsed.step === 'quiz' && parsed.timer) {
                state = parsed;
                state.timer.intervalId = setInterval(() => {
                    state.timer.remainingSeconds--;
                    const elapsed = state.timer.totalSeconds - state.timer.remainingSeconds;
                    if (elapsed >= state.timer.totalSeconds / 2) state.timer.canSubmit = true;
                    
                    if (state.timer.remainingSeconds <= 0) {
                        clearInterval(state.timer.intervalId);
                        if (state.step === 'quiz') finishQuiz(true);
                    }
                    if (state.step === 'quiz') updateTimerUI();
                    saveState();
                }, 1000);
                render();
                return;
            }
            if (parsed.step === 'result') {
                state = parsed;
                render();
                return;
            }
        }
        render();
    }

    window.addEventListener('beforeunload', () => {
        if (state.timer.intervalId) clearInterval(state.timer.intervalId);
    });

    init();
</script>
</body>
</html>
